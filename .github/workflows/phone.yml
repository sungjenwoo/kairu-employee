# Builds the Kairu phone app (phone/, PHONE.md) on GitHub's machines, so the PC never runs Android Studio.
# The finished app is the "kairu-phone" artifact of each run: download it, then `kairu phone install`.
name: Phone app

on:
  push:
    paths: ["phone/**", ".github/workflows/phone.yml"]
  pull_request:
    paths: ["phone/**", ".github/workflows/phone.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Keep the same debug signing key between runs (used only until the owner adds the signing key secret)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kairu-phone-debug-keystore-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: The owner's signing key, if it is in the repository's secrets
        env:
          KEYSTORE_B64: ${{ secrets.KAIRU_PHONE_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kairu.jks"
            echo "KAIRU_KEYSTORE_FILE=$RUNNER_TEMP/kairu.jks" >> "$GITHUB_ENV"
            echo "Signed with the owner's key."
          else
            echo "No signing key secret: the cached debug key signs this build."
          fi
      - name: Build
        env:
          KAIRU_KEYSTORE_PASSWORD: ${{ secrets.KAIRU_PHONE_KEYSTORE_PASSWORD }}
        run: gradle -p phone testDebugUnitTest assembleRelease --no-daemon --stacktrace
      - name: Test results
        if: always()
        run: cat phone/app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | grep -E "<testsuite|<testcase|<failure" | head -60 || true
      - name: Name the app
        run: |
          mkdir -p out
          cp phone/app/build/outputs/apk/release/app-release.apk "out/kairu-phone-0.1.${GITHUB_RUN_NUMBER}.apk"
          sha256sum out/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kairu-phone
          path: out/*.apk
          retention-days: 14
          if-no-files-found: error
